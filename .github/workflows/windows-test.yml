
name: Windows Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Verify runner
        shell: pwsh
        run: |
          Write-Host "Runner started successfully"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores
          Write-Host "Diagnostic complete"
